server.port=8080

# ============================================================
# Azure AD B2C - Tenant: CloudeGrupo2.onmicrosoft.com
# Flujo de usuario: B2C_1_grupo2
# ============================================================

# El issuer del idToken de Azure B2C
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://CloudeGrupo2.b2clogin.com/CloudeGrupo2.onmicrosoft.com/B2C_1_grupo2/v2.0/

# JWK Set URI para verificar la firma
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://CloudeGrupo2.b2clogin.com/CloudeGrupo2.onmicrosoft.com/B2C_1_grupo2/discovery/v2.0/keys

# ============================================================
# CORS - Permite llamadas desde Angular en localhost:4200
# ============================================================
cors.allowed-origins=http://localhost:4200

# ============================================================
# Logging
# ============================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.tienda=DEBUG
