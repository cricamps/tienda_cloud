<nav class="navbar">
  <a class="navbar-brand" routerLink="/">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon">
      <circle cx="8" cy="21" r="1"/>
      <circle cx="19" cy="21" r="1"/>
      <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
    </svg>
    <span>Tienda Don Pepe</span>
  </a>
  
  <div class="navbar-actions">
    <a routerLink="/catalogo" routerLinkActive="active" class="nav-link">Productos</a>
    
    <a routerLink="/carrito" routerLinkActive="active" class="nav-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <span>Carrito</span>
      <span class="badge" *ngIf="tiendaService.totalItems() > 0">{{ tiendaService.totalItems() }}</span>
    </a>
    
    <div class="vertical-divider"></div>
    
    <div class="navbar-user">
      <a routerLink="/perfil" routerLinkActive="active" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>{{ tiendaService.getNombreUsuario() }}</span>
      </a>
      
      <button class="btn-logout" (click)="logout()">

      </button>
