<app-navbar />

<div class="page">
  <div class="toast" *ngIf="guardado">✅ Perfil guardado correctamente</div>

  <div class="perfil-layout">

    <!-- TARJETA AVATAR -->
    <div class="avatar-card">
      <div class="avatar">{{ iniciales }}</div>
      <h2>{{ perfil.nombre }}</h2>
      <p>{{ perfil.email }}</p>
      <div class="avatar-badge">Cliente verificado ✓</div>
    </div>

    <!-- FORMULARIO -->
    <div class="info-card">
      <div class="card-title">
        <h2>Información personal</h2>
        <button *ngIf="!editando" class="btn-editar" (click)="editar()">✏️ Editar</button>
      </div>

      <form (ngSubmit)="guardar()">
        <div class="form-grid">

          <div class="form-group">
            <label>Nombre completo</label>
            <input
              type="text"
              [(ngModel)]="perfil.nombre"
              name="nombre"
              [readonly]="!editando"
              [class.readonly]="!editando"
              placeholder="Tu nombre"
            />
          </div>

          <div class="form-group">
            <label>Correo electrónico</label>
            <input
              type="email"
              [(ngModel)]="perfil.email"
              name="email"
              [readonly]="true"
              class="readonly"
              placeholder="tu@email.com"
            />
            <small>El email no puede modificarse</small>
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input
              type="tel"
              [(ngModel)]="perfil.telefono"
              name="telefono"
              [readonly]="!editando"
              [class.readonly]="!editando"
              placeholder="+56 9 1234 5678"
            />
          </div>

          <div class="form-group full">
            <label>Dirección de despacho</label>
            <input
              type="text"
              [(ngModel)]="perfil.direccion"
              name="direccion"
              [readonly]="!editando"
              [class.readonly]="!editando"
              placeholder="Calle, número, ciudad"
            />
          </div>
        </div>

        <div class="form-acciones" *ngIf="editando">
          <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn-guardar">💾 Guardar cambios</button>
        </div>
      </form>
    </div>

  </div>
</div>
